default_dirs:
  skills:
    - default: .claude/skills/
    - global: ~/.claude/skills/
  agents:
    - default: .claude/agents/
    - global: ~/.claude/agents/
  prompts:
    - default: .claude/commands/
    - global: ~/.claude/commands/

library:
  skills:
    - name: brandkit
      description: Premium brand-kit image generation for brand-guidelines boards, logo systems, identity decks, and visual-world presentations
      source: https://github.com/jigrullon/the-library/blob/main/skills/brandkit/SKILL.md

    - name: design-taste-frontend
      description: Anti-slop frontend skill for landing pages, portfolios, and redesigns that avoids templated-looking interfaces
      source: https://github.com/jigrullon/the-library/blob/main/skills/design-taste-frontend/SKILL.md

    - name: find-skills
      description: Helps discover and install agent skills when the user asks "how do I do X" or "is there a skill for X"
      source: https://github.com/jigrullon/the-library/blob/main/skills/find-skills/SKILL.md

    - name: gpt-taste
      description: UX/UI and GSAP motion engineer skill with randomized layouts, AIDA page structure, editorial typography, and bento grids
      source: https://github.com/jigrullon/the-library/blob/main/skills/gpt-taste/SKILL.md

    - name: image-to-code
      description: Generates design images first, analyzes them, then implements the website to match them closely
      source: https://github.com/jigrullon/the-library/blob/main/skills/image-to-code/SKILL.md

    - name: imagegen-frontend-web
      description: Generates premium website design reference images, one per section, with a consistent palette and varied compositions
      source: https://github.com/jigrullon/the-library/blob/main/skills/imagegen-frontend-web/SKILL.md

    - name: minimalist-ui
      description: Clean editorial-style interfaces with a warm monochrome palette, flat bento grids, and muted pastels
      source: https://github.com/jigrullon/the-library/blob/main/skills/minimalist-ui/SKILL.md

    - name: recall
      description: Search a project's memory logs (memory/log/ + memory/index.sqlite3) to answer questions about past work, with source citations
      source: https://github.com/jigrullon/the-library/blob/main/skills/recall/SKILL.md

    - name: redesign-existing-projects
      description: Upgrades existing websites and apps to premium quality by auditing the current design and removing generic AI patterns
      source: https://github.com/jigrullon/the-library/blob/main/skills/redesign-existing-projects/SKILL.md

    - name: remember
      description: Save, update, or remove entries in a project's working-memory snapshot (memory/working-memory.md), which is injected at the start of every session
      source: https://github.com/jigrullon/the-library/blob/main/skills/remember/SKILL.md

  agents: []
  prompts: []
